<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Die Deutschland-Expedition</title>
<style>
:root{
  --paper:#f7eedb; --paper2:#efe2c4; --ink:#3a2c22; --ink2:#6b5644;
  --orange:#ef7b2d; --orange2:#c95e16; --teal:#1f9e89; --teal2:#157a69;
  --sea1:#8fd0ec; --sea2:#5aaed8; --red:#e04848; --gold:#f2b632; --fog:#c9ced6;
  --font:"Trebuchet MS", ui-rounded, "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font)}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.paperbg{background:
  radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.55), transparent 55%),
  radial-gradient(ellipse at 80% 90%, rgba(201,160,100,.18), transparent 60%),
  var(--paper)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:16px;padding:13px 20px;font-size:18px;font-weight:700;color:#fff;background:var(--orange);
  box-shadow:0 4px 0 var(--orange2);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange2)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 var(--teal2)}
.btn.ghost{background:#fff8ea;color:var(--ink);box-shadow:0 4px 0 #d9c7a3}
.btn.small{padding:8px 13px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.45}

/* ---------- intro ---------- */
#intro{align-items:center;justify-content:center;padding:18px}
.storycard{max-width:560px;width:100%;background:#fffaf0;border:3px solid #e3cfa6;border-radius:26px;padding:22px 22px 20px;
  box-shadow:0 10px 30px rgba(90,60,20,.18);text-align:center;position:relative}
.storycard h1{margin:4px 0 6px;font-size:30px;letter-spacing:.5px;color:var(--orange2);text-shadow:0 2px 0 #fff}
.storycard p{font-size:18px;line-height:1.45;margin:10px 0}
.scene{height:190px;margin:-6px auto 4px;max-width:420px}
.dots{display:flex;gap:7px;justify-content:center;margin:12px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#e3cfa6}.dots i.on{background:var(--orange)}
.nameinput{font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #e3cfa6;width:80%;text-align:center;background:#fff;color:var(--ink)}
.colors{display:flex;gap:12px;justify-content:center;margin:12px 0 4px}
.colors button{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #e3cfa6}
.colors button.on{box-shadow:0 0 0 4px var(--ink)}

/* ---------- hub ---------- */
#hub .top{padding:16px 16px 8px;display:flex;align-items:center;gap:12px}
#hub .top .who{flex:1}
#hub .top h2{margin:0;font-size:24px;color:var(--orange2)}
#hub .top .rank{font-size:15px;color:var(--ink2)}
.coins{background:#fff4d6;border:2px solid var(--gold);border-radius:20px;padding:6px 12px;font-weight:800;font-size:17px;white-space:nowrap}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:8px 16px 24px;max-width:1100px;margin:0 auto;width:100%}
.ccard{background:#fffaf0;border:3px solid #e3cfa6;border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;color:var(--ink);
  position:relative;box-shadow:0 5px 0 #e3cfa6;font-size:16px}
.ccard:active{transform:translateY(3px);box-shadow:0 2px 0 #e3cfa6}
.ccard .ic{font-size:40px;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
.ccard .t{font-weight:800;font-size:18px}
.ccard .s{font-size:14px;color:var(--ink2);margin-top:2px}
.bar{height:10px;background:#eee0c2;border-radius:6px;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#56c9a5);border-radius:6px;transition:width .6s}
.stamp{position:absolute;right:-6px;top:-10px;width:54px;height:54px;border-radius:50%;border:3px dashed var(--red);color:var(--red);
  display:grid;place-items:center;font-size:11px;font-weight:900;transform:rotate(14deg);background:rgba(255,250,240,.92);text-align:center;line-height:1.05}
.stamp.gold{border-color:#c48a00;color:#c48a00;border-style:double;border-width:5px}
.ccard.boss{background:linear-gradient(135deg,#4b4f6b,#2f3149);color:#fff;border-color:#25273a;box-shadow:0 5px 0 #191a28}
.ccard.boss .s{color:#cfd3ee}
.hubsec{max-width:1100px;margin:6px auto 0;width:100%;padding:0 16px;font-weight:800;color:var(--ink2);font-size:15px;text-transform:uppercase;letter-spacing:1px}
.hubfoot{text-align:center;padding:4px 16px 30px}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:14px}

/* ---------- play ---------- */
#play{background:var(--paper)}
.bar-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fffaf0;border-bottom:3px solid #e3cfa6;z-index:3}
.bar-top .title{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:#fff3dc;border-radius:12px;width:40px;height:40px;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #e3cfa6}
.playmain{flex:1;display:flex;min-height:0}
.mapwrap{flex:1;position:relative;min-height:0;min-width:0;overflow:hidden;background:linear-gradient(#a7dcf1,#6fb8dd)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,250,240,.92);font-size:20px;font-weight:800;box-shadow:0 2px 0 #c9b48b;color:var(--ink)}
.panel{background:#fffaf0;border-top:3px solid #e3cfa6;padding:10px 12px 12px;z-index:2;height:47%;flex:none;display:block}
@media (min-width:900px){
  .playmain{flex-direction:row}
  .panel{width:410px;height:auto;border-top:0;border-left:3px solid #e3cfa6;padding:18px}
}
@media (max-width:899px){ .playmain{flex-direction:column} }
.progress{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.progress i{flex:1;min-width:8px;height:8px;border-radius:4px;background:#eadbb9}
.progress i.ok{background:var(--teal)} .progress i.bad{background:var(--red)} .progress i.cur{background:var(--orange)}
.guide{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:50px;height:50px;border-radius:50%;background:#ffe7b8;border:3px solid #e3b66a;display:grid;place-items:center;font-size:30px}
.bubble{flex:1;background:#fff;border:2px solid #e3cfa6;border-radius:4px 18px 18px 18px;padding:10px 12px;font-size:18px;line-height:1.35;min-height:50px}
.bubble b{color:var(--orange2)}
.bubble .fact{display:block;margin-top:6px;font-size:16px;color:var(--ink2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.opt{border:3px solid #e3cfa6;background:#fff;border-radius:14px;padding:11px 8px;font-size:17px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #e3cfa6;min-height:52px}
.opt:active{transform:translateY(2px)}
.opt.right{background:#d8f5e9;border-color:var(--teal);box-shadow:0 3px 0 var(--teal2)}
.opt.wrong{background:#fde0e0;border-color:var(--red);box-shadow:0 3px 0 #a83232}
.opt[disabled]{cursor:default}
.taphint{margin-top:10px;text-align:center;font-size:15px;color:var(--ink2);animation:pulse 1.6s infinite}
.next{margin-top:12px;width:100%}
.streak{display:inline-block;margin-left:6px;font-size:14px;background:#ffe2c9;border-radius:10px;padding:2px 8px;color:var(--orange2);font-weight:800}
@keyframes pulse{50%{opacity:.5}}
.bossbox{display:flex;align-items:center;gap:10px;margin-bottom:8px;background:#2f3149;border-radius:14px;padding:6px 10px;color:#fff}
.bossbox svg{width:54px;height:44px;transition:transform .4s}
.hp{flex:1;height:14px;background:#55587a;border-radius:8px;overflow:hidden}
.hp b{display:block;height:100%;background:linear-gradient(90deg,#9aa3c7,#e6e9ff);transition:width .5s}

/* ---------- map styling ---------- */
.state{stroke:#fffaf0;stroke-width:1.3;stroke-linejoin:round;transition:fill .8s, opacity .3s}
.country{fill:#efe4c8;stroke:#d4c39e;stroke-width:.8}
.mode-laender .state{fill:url(#fog)}
.mode-laender .state.rev{fill:var(--c)}
.mode-staedte .state, .mode-fluesse .state, .mode-gebirge .state, .mode-berge .state{fill:var(--cn)}
.mode-atlas .state, .mode-finale .state{fill:var(--c)}
.state.hl{stroke:var(--orange);stroke-width:4;animation:hlpulse 1s infinite}
.state.flash{fill:#f6a1a1 !important}
@keyframes hlpulse{50%{stroke:#ffd36b}}
.river,.riverflow,.riverhit{fill:none;stroke-linecap:round;stroke-linejoin:round}
.river{stroke:#a9bfcf;stroke-width:2.4;stroke-dasharray:1 4}
.river.rev{stroke:#2a7fc0;stroke-dasharray:none;stroke-width:2.6}
.riverflow{stroke:#bfe6ff;stroke-width:1.2;stroke-dasharray:3 9;opacity:0}
.riverflow.rev{opacity:.95;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.river.hl{stroke:var(--orange)!important;stroke-width:5!important;stroke-dasharray:none!important;animation:hlpulseR 1s infinite}
@keyframes hlpulseR{50%{stroke:#ffcf5a}}
.riverhit{stroke:transparent;stroke-width:16;pointer-events:stroke}
.lyr-rivers,.lyr-caps,.lyr-geb,.lyr-berg{display:none}
.mode-fluesse .lyr-rivers,.mode-atlas.show-rivers .lyr-rivers,.mode-finale.q-fluesse .lyr-rivers{display:inline}
.mode-staedte .lyr-caps,.mode-atlas.show-caps .lyr-caps,.mode-finale.q-staedte .lyr-caps{display:inline}
.mode-gebirge .lyr-geb,.mode-atlas.show-geb .lyr-geb,.mode-finale.q-gebirge .lyr-geb{display:inline}
.mode-berge .lyr-berg,.mode-atlas.show-berg .lyr-berg,.mode-finale.q-berge .lyr-berg{display:inline}
.mode-atlas .river,.mode-finale .river{stroke:#2a7fc0;stroke-dasharray:none}
.mode-atlas .riverflow,.mode-finale .riverflow{opacity:.95;animation:flow 1.4s linear infinite}
.cap .flag{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:0% 100%;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.cap.rev .flag,.mode-atlas .cap .flag,.mode-finale .cap .flag{opacity:1;transform:scale(1)}
.cap .dot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.cap.rev .dot,.mode-atlas .cap .dot{fill:var(--red)}
.cap.hl .dot{fill:var(--orange);stroke:#fff;stroke-width:2}
.geb .rng{fill:#c4c8cf;stroke:#8f959f;stroke-width:1}
.geb .snow{fill:#e9ecf1}
.geb.rev .rng,.mode-atlas .geb .rng,.mode-finale .geb .rng{fill:#8b6b4a;stroke:#5d4630}
.geb.rev .snow,.mode-atlas .geb .snow,.mode-finale .geb .snow{fill:#fff}
.geb .zz{fill:none;stroke:#7d8592;stroke-width:1.2;opacity:.8}
.geb.rev .zz,.mode-atlas .geb .zz,.mode-finale .geb .zz{opacity:0}
.berg .pk{fill:#b9bec7;stroke:#7f8691;stroke-width:1}
.berg.rev .pk,.mode-atlas .berg .pk,.mode-finale .berg .pk{fill:#7a5a3a;stroke:#4d3826}
.berg .pf{opacity:0;transform:scale(.1);transform-box:fill-box;transform-origin:0% 100%;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.berg.rev .pf,.mode-atlas .berg .pf{opacity:1;transform:scale(1)}
.ring{fill:none;stroke:var(--orange);stroke-width:3;opacity:0}
.hl .ring{opacity:1;animation:ring 1.1s infinite}
@keyframes ring{from{r:9;opacity:1}to{r:22;opacity:0}}
.lbl{font-family:var(--font);font-weight:800;paint-order:stroke;stroke:#fffaf0;stroke-width:3.2;stroke-linejoin:round;fill:var(--ink);pointer-events:none;text-anchor:middle}
.lyr-labels{display:none}
.mode-atlas.show-names .lbl-state{display:inline}
.lbl-state,.lbl-cap,.lbl-river,.lbl-geb,.lbl-berg{display:none}
.mode-atlas.show-names .lyr-labels,.mode-atlas .lyr-labels{display:inline}
.mode-atlas.show-names .lbl-state{display:inline}
.mode-atlas.show-caps .lbl-cap{display:inline}
.mode-atlas.show-rivers .lbl-river{display:inline}
.mode-atlas.show-geb .lbl-geb{display:inline}
.mode-atlas.show-berg .lbl-berg{display:inline}
.lbl-river{fill:#1a5f94;font-style:italic}
.lbl-geb{fill:#5d4630}
.sealbl{font-family:var(--font);font-style:italic;font-weight:700;fill:#2d7fae;opacity:.8;letter-spacing:2px;pointer-events:none;text-anchor:middle}
.cntlbl{font-family:var(--font);font-weight:700;fill:#b4a27c;letter-spacing:1px;pointer-events:none;text-anchor:middle;text-transform:uppercase}
.tag rect{fill:#fff;stroke:var(--teal);stroke-width:2}
.tag.bad rect{stroke:var(--red)}
.tag text{font-family:var(--font);font-weight:800;fill:var(--ink);text-anchor:middle}
.tag{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tag{transform-box:fill-box;transform-origin:50% 100%;pointer-events:none}
#balloon{transition:transform 1.3s cubic-bezier(.45,.05,.3,1);pointer-events:none}
#balloon .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.puff{pointer-events:none}
.puff circle{fill:#fff;animation:puff .9s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes puff{from{opacity:.95;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.6)}}
.home text{font-family:var(--font);font-weight:800;font-size:8px;fill:#7a3d10;paint-order:stroke;stroke:#fffaf0;stroke-width:2.5;text-anchor:middle}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,28,15,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.overlay.on{display:flex}
.modal{background:#fffaf0;border:3px solid #e3cfa6;border-radius:26px;max-width:520px;width:100%;padding:20px;text-align:center;max-height:94vh;overflow:auto;
  animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.modal h2{margin:6px 0;color:var(--orange2);font-size:26px}
.modal p{font-size:17px;line-height:1.45}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars .off{filter:grayscale(1);opacity:.35}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* confetti */
.confetti{position:fixed;width:9px;height:14px;z-index:30;pointer-events:none;border-radius:2px;animation:conf 1.4s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.7}}
.coinfly{position:fixed;z-index:30;font-weight:900;color:#b98300;font-size:22px;pointer-events:none;animation:coin 1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes coin{to{transform:translateY(-70px);opacity:0}}

/* ---------- memory ---------- */
#memory .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;max-width:560px;margin:0 auto;width:100%}
@media (min-width:600px){#memory .grid{grid-template-columns:repeat(4,1fr)}}
.mcard{aspect-ratio:3/3.4;perspective:600px;border:0;background:none;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;font-weight:800;font-size:15px;line-height:1.15}
.mcard .f{background:linear-gradient(135deg,var(--orange),#f5a35b);color:#fff;font-size:32px;box-shadow:0 4px 0 var(--orange2)}
.mcard .b{transform:rotateY(180deg);background:#fff;border:3px solid #e3cfa6;color:var(--ink)}
.mcard .b small{display:block;font-size:11px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.mcard.done .b{background:#d8f5e9;border-color:var(--teal)}

/* ---------- list ---------- */
.listwrap{max-width:900px;margin:0 auto;padding:10px 16px 40px;width:100%}
.listwrap h3{color:var(--orange2);margin:22px 0 8px;font-size:21px}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:7px 9px;border-bottom:1px solid #efe2c4;text-align:left;vertical-align:top}
th{background:#f3e5c5}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- certificate ---------- */
.cert{background:#fffdf6;border:10px double #c9a24a;border-radius:10px;padding:26px 22px;text-align:center;max-width:620px;width:100%;position:relative}
.cert h1{font-size:34px;margin:4px 0;color:#9a6b00;letter-spacing:3px}
.cert .nm{font-size:34px;font-weight:900;color:var(--orange2);margin:10px 0;border-bottom:2px dashed #c9a24a;display:inline-block;padding:0 20px}
.cert p{font-size:17px;line-height:1.5}
.seal{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#f5c84c,#d39a14);color:#fff;font-weight:900;display:grid;place-items:center;margin:10px auto 0;
  box-shadow:0 0 0 5px #f3dc8f;font-size:12px;line-height:1.1}
@media print{
  body *{visibility:hidden}
  .printme, .printme *{visibility:visible}
  .printme{position:absolute;left:0;top:0;width:100%;max-height:none;overflow:visible}
  .noprint{display:none!important}
  html,body{overflow:visible;height:auto}
}
</style>
</head>
<body>

<!-- ============ INTRO ============ -->
<section id="intro" class="screen paperbg">
  <div class="storycard">
    <div id="introBody"></div>
    <div class="dots" id="introDots"></div>
    <div class="row"><button class="btn ghost" id="introBack">Zurück</button><button class="btn" id="introNext">Weiter ➜</button></div>
  </div>
</section>

<!-- ============ HUB ============ -->
<section id="hub" class="screen paperbg scroll">
  <div class="top">
    <div style="font-size:40px">🎈</div>
    <div class="who"><h2 id="hubName">Deutschland-Expedition</h2><div class="rank" id="hubRank"></div></div>
    <div class="coins" id="hubCoins">🪙 0</div>
  </div>
  <div class="hubsec">Deine Expedition</div>
  <div class="hubgrid" id="hubChapters"></div>
  <div class="hubsec">Extras</div>
  <div class="hubgrid" id="hubExtras"></div>
  <div class="hubfoot"><button class="linkbtn" id="btnStory">Geschichte nochmal ansehen</button> · <button class="linkbtn" id="btnReset">Fortschritt zurücksetzen</button></div>
</section>

<!-- ============ PLAY ============ -->
<section id="play" class="screen">
  <div class="bar-top">
    <button class="iconbtn" id="btnHome" title="Zur Expeditionskarte">🏕️</button>
    <div class="title" id="playTitle"></div>
    <div class="coins" id="playCoins">🪙 0</div>
    <button class="iconbtn" id="btnSound" title="Ton an/aus">🔊</button>
  </div>
  <div class="playmain">
    <div class="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoom"><button id="zIn">+</button><button id="zOut">−</button><button id="zReset" style="font-size:16px">⤢</button></div>
    </div>
    <div class="panel scroll" id="panel"></div>
  </div>
</section>

<!-- ============ MEMORY ============ -->
<section id="memory" class="screen paperbg scroll">
  <div class="bar-top">
    <button class="iconbtn" id="memHome">🏕️</button>
    <div class="title">Hauptstadt-Memory</div>
    <div class="coins" id="memInfo">Züge: 0</div>
  </div>
  <p style="text-align:center;margin:12px 16px 0;font-size:17px">Finde immer das <b>Bundesland</b> und seine <b>Hauptstadt</b>!</p>
  <div class="grid" id="memGrid"></div>
</section>

<!-- ============ LIST ============ -->
<section id="list" class="screen paperbg scroll">
  <div class="bar-top noprint">
    <button class="iconbtn" id="listHome">🏕️</button>
    <div class="title">Spickzettel – alles auf einen Blick</div>
    
  </div>
  <div class="listwrap printme" id="listBody"></div>
</section>

const ptrs=new Map();let drag=null,moved=false,pinch=null;
function clientToSvg(cx,cy){const r=svg.getBoundingClientRect();const s=Math.max(VB.w/r.width,VB.h/r.height);const ox=r.left+(r.width-VB.w/s)/2,oy=r.top+(r.height-VB.h/s)/2;return[VB.x+(cx-ox)*s,VB.y+(cy-oy)*s,s];}
function clampVB(){VB.w=Math.min(VB0.w,Math.max(VB0.w/6,VB.w));VB.h=VB.w*VB0.h/VB0.w;VB.x=Math.max(VB0.x-VB.w*.2,Math.min(VB0.x+VB0.w-VB.w*.8,VB.x));VB.y=Math.max(VB0.y-VB.h*.2,Math.min(VB0.y+VB0.h-VB.h*.8,VB.y));setVB();}
function zoomAt(f,cx,cy){const [sx,sy]=cx==null?[VB.x+VB.w/2,VB.y+VB.h/2]:clientToSvg(cx,cy);const nw=Math.min(VB0.w,Math.max(VB0.w/6,VB.w*f));const k=nw/VB.w;VB.x=sx-(sx-VB.x)*k;VB.y=sy-(sy-VB.y)*k;VB.w=nw;VB.h=nw*VB0.h/VB0.w;if(nw>=VB0.w){Object.assign(VB,VB0);}clampVB();}
$('zIn').onclick=()=>zoomAt(.7);$('zOut').onclick=()=>zoomAt(1/.7);$('zReset').onclick=()=>{Object.assign(VB,VB0);setVB();};

svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.target});if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};moved=false;}else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:VB.w,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};moved=true;}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const target=pinch.w*pinch.d/d;zoomAt(target/VB.w,pinch.cx,pinch.cy);return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)moved=true;if(moved&&VB.w<VB0.w){const r=svg.getBoundingClientRect();const s=Math.max(VB.w/r.width,VB.h/r.height);VB.x=drag.vx-dx*s;VB.y=drag.vy-dy*s;clampVB();}}});
function ptrEnd(e){const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){if(!moved&&p){const t=(p.t&&p.t.closest)?p.t.closest('[data-t]'):null;onMapTap(t,e);}drag=null;}}

function puff(x,y){const g=el('g',{class:'puff'},$('fx'));for(let i=0;i<9;i++){const a=i/9*Math.PI*2;const c=el('circle',{cx:x,cy:y,r:5+Math.random()*4},g);c.style.setProperty('--dx',Math.cos(a)*22+'px');c.style.setProperty('--dy',Math.sin(a)*22+'px');}setTimeout(()=>g.remove(),1000);}
function tag(x,y,txt,bad){const g=el('g',{class:'tag'+(bad?' bad':'')},$('tags'));const fs=Math.max(8,Math.min(15,VB.w/40));const h=fs*1.75;

function confetti(n=26){const cols=['#ef7b2d','#1f9e89','#f2b632','#e04848','#7cc3e8','#9b5de5'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';d.style.left=(20+Math.random()*60)+'vw';d.style.top=(-5-Math.random()*10)+'vh';d.style.background=rnd(cols);d.style.setProperty('--dx',(Math.random()*40-20)+'vw');d.style.setProperty('--r',(Math.random()*720)+'deg');d.style.animationDelay=Math.random()*.25+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}}

<script>
/* ======================= FRAGEN ======================= */
function opts(answer,pool,ex){const others=shuffle(pool.filter(p=>p!==answer&&!(ex||[]).includes(p))).slice(0,3);return shuffle([answer,...others]);}
const stateNames=STATES.map(s=>s.name),capNames=STATES.map(s=>s.cap),riverNames=RIVERS.map(r=>r.id),gebNames=GEBIRGE.map(g=>g.name),bergNames=BERGE.map(b=>b.name);
const capOf=n=>STATES.find(s=>s.cap===n);

function makeQ(ch,id,avoidKind){
  let q, r=Math.random();
  if(ch==='laender'){const s=SB[id];
    if((r<.5&&avoidKind!=='tap')||avoidKind==='choice') q={kind:'tap',tapType:'state',target:id,text:`Tippe auf das Bundesland <b>${s.name}</b>!`};
    else q={kind:'choice',hl:['state',id],text:'Wie heißt das <b>leuchtende</b> Bundesland?',options:opts(s.name,stateNames),answer:s.name};
    q.sol=['state',id];q.solName=s.name;q.fact=s.fact;}
  if(ch==='staedte'){const s=SB[id];
    if(r<.4) q={kind:'choice',hl:['state',id],text:`Wie heißt die Hauptstadt von <b>${s.name}</b>?`,options:opts(s.cap,capNames),answer:s.cap};
    else if(r<.7) q={kind:'choice',hl:['cap',id],text:`<b>${s.cap}</b> ist die Hauptstadt von …`,options:opts(s.name,stateNames),answer:s.name};
    else q={kind:'tap',tapType:'state',target:id,text:`In welchem Bundesland liegt die Hauptstadt <b>${s.cap}</b>? Tippe auf das Land!`};
    if(s.id==='BE'||s.id==='HB'||s.id==='HH'){ if(q.kind==='tap'||r<.7&&r>=.4) q={kind:'choice',hl:['state',id],text:`Wie heißt die Hauptstadt von <b>${s.name}</b>?`,options:opts(s.cap,capNames),answer:s.cap}; }
    q.sol=['cap',id];q.solName=`${s.cap} (${s.name})`;q.fact=s.fact;}
  if(ch==='fluesse'){const v=RB[id];
    if(r<.38) q={kind:'choice',hl:['river',id],text:'Welcher Fluss <b>leuchtet</b> auf der Karte?',options:opts(id,riverNames),answer:id};
    else if(r<.66&&avoidKind!=='tap') q={kind:'tap',tapType:'river',target:id,text:`Tippe auf den Fluss <b>${id}</b>!`};
    else {const t=rnd(v.qs)[0];q={kind:'choice',text:t,options:opts(id,riverNames,v.ex),answer:id};}
    q.sol=['river',id];q.solName=id;q.fact=v.fact;}
  if(ch==='gebirge'){const g=GB[id];
    if(r<.42) q={kind:'choice',hl:['geb',id],text:'Welches Gebirge <b>leuchtet</b> auf der Karte?',options:opts(g.name,gebNames),answer:g.name};
    else if(r<.8||!g.land) q={kind:'tap',tapType:'geb',target:id,text:`Tippe auf das Gebirge <b>${g.name}</b>!`};
    else q={kind:'choice',text:`In welchem Bundesland liegt ${g.id==='alpen'?'der deutsche Teil der <b>Alpen</b>':(['eifel','rhoen','alb'].includes(g.id)?'die':(['erz','fichtel','egge','sauerland','rothaar'].includes(g.id)?'das':'der'))+(g.id==='alpen'?'':' <b>'+g.name.replace('Bayerischer','Bayerische')+'</b>')}?`,options:opts(SB[g.land].name,stateNames),answer:SB[g.land].name};
    q.sol=['geb',id];q.solName=g.name;q.fact=g.fact;}
  if(ch==='berge'){const b=BB_[id];
    const types=['hl','geb','hoch'];if(b.top)types.push('top','top');
    const t=rnd(types);
    if(t==='hl') q={kind:'choice',hl:['berg',id],text:'Welcher Berg <b>leuchtet</b> auf der Karte?',options:opts(b.name,bergNames),answer:b.name};
    if(t==='geb') q={kind:'choice',hl:['berg',id],text:`In welchem Gebirge liegt ${art(b)} <b>${nom(b)}</b>?`,options:opts(GB[b.geb].name,gebNames),answer:GB[b.geb].name};
    if(t==='hoch'){const hs=BERGE.filter(x=>Math.abs(x.h-b.h)>40).map(x=>x.h+' m');q={kind:'choice',hl:['berg',id],text:`Wie hoch ist ${art(b)} <b>${nom(b)}</b>?`,options:opts(b.h+' m',hs),answer:b.h+' m'};}
    if(t==='top'){const pool=bergNames.filter(n=>n!=='Watzmann'||b.id!=='zugspitze');q={kind:'choice',text:`Welcher ist der höchste Berg <b>${b.top}</b>?`,options:opts(b.name,pool,b.id==='zugspitze'?['Watzmann']:(b.id==='asten'?['Velmerstot']:[])),answer:b.name};}
    q.sol=['berg',id];q.solName=`${b.name} (${b.h} m, ${GB[b.geb].name})`;q.fact=b.fact;}
  q.ch=ch;q.id=id;return q;
}
function art(b){return ['Zugspitze','Wasserkuppe','Hohe Acht'].includes(b.name)?'die':'der';}
function nom(b){return b.name.replace('Großer ','Große ').replace('Kahler ','Kahle ');}

/* ======================= RUNDE ======================= */
let R=null; // aktuelle Runde
function pickItems(ch,n){
  const items=CHB[ch].items.map(id=>{const r=S.items[ch]&&S.items[ch][id];const lvl=!r||!r.r?0:(r.s>=2?2.2:(r.s>=1?1.2:.6));return{id,score:lvl+Math.random()*1.4};});

function startChapter(ch,skipIntro){
  if(!skipIntro){storyModal(CHB[ch],()=>startChapter(ch,true));return;}
  R={ch,boss:false,queue:pickItems(ch,10),i:0,res:[],streak:0,firstTry:0,newRev:0,maxLen:14,wrongIds:new Set()};

function startBoss(skipIntro){
  if(!skipIntro){bossIntro();return;}
  R={ch:'finale',boss:true,hp:10,maxhp:10,i:0,res:[],streak:0,firstTry:0,newRev:0,maxLen:30,queue:[]};

function nextQ(){
  clearTags();clearHL();
  if(R.boss){
    if(R.hp<=0||R.i>=R.maxLen){return endRound();}
    const ch=rnd(CHAPTERS).id;const id=pickItems(ch,4)[Math.floor(Math.random()*4)];

function guideHTML(inner){return `<div class="guide"><div class="avatar">🦉</div><div class="bubble">${inner}</div></div>`;}
function progressHTML(){
  if(R.boss){return `<div class="bossbox"><div style="transform:scale(${.45+.55*R.hp/R.maxhp});transition:transform .5s">${ghostSVG()}</div><div style="flex:1"><div style="font-size:13px;font-weight:800;margin-bottom:3px">Graf Grauschleier</div><div class="hp"><b style="width:${R.hp/R.maxhp*100}%"></b></div></div></div>`;}
  let h='<div class="progress">';for(let k=0;k<R.queue.length;k++){h+=`<i class="${k<R.res.length?(R.res[k]?'ok':'bad'):(k===R.i?'cur':'')}"></i>`;}return h+'</div>';
}
function renderPanel(fb){
  const q=R.q;let h=progressHTML();
  if(!fb){
    h+=guideHTML(q.text+(R.streak>=3?`<span class="streak">🔥 ${R.streak}er-Serie</span>`:''));
    if(q.kind==='choice'){h+='<div class="opts">'+q.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')+'</div>';}
    else h+=`<div class="taphint">👆 Tippe direkt auf die Karte${VB.w<VB0.w?'':' – mit + kannst du näher heranzoomen'}</div>`;
  } else {
    h+=guideHTML(fb.html);
    if(q.kind==='choice'){h+='<div class="opts">'+q.options.map((o,k)=>`<button class="opt ${o===q.answer?'right':(k===fb.pick?'wrong':'')}" disabled>${esc(o)}</button>`).join('')+'</div>';}

  }

  if(fb)$('btnNext').onclick=()=>{R.i++;nextQ();};

function onMapTap(t){
  if(!t)return;

  }

function answer(k,tapId){
  const q=R.q;if(R.answered)return;R.answered=true;
  const ok=q.kind==='choice'?q.options[k]===q.answer:tapId===q.target;
  R.res.push(ok);

  // Karte
  clearHL();
  const [st,sid]=q.sol;const [x,y]=locOf(st,sid);
  if(q.kind==='tap'&&!ok&&tapId){const wt=q.tapType==='state'?SB[tapId].name:q.tapType==='river'?tapId:q.tapType==='geb'?GB[tapId].name:BB_[tapId].name;const [wx,wy]=locOf(q.tapType,tapId);tag(wx,wy,'Das ist: '+wt,true);
    if(q.tapType==='state'){MAP.states[tapId].classList.add('flash');setTimeout(()=>MAP.states[tapId].classList.remove('flash'),900);}}

    html=`<b>${rnd(['Super!','Richtig!','Klasse!','Stark!','Genau!','Spitze!'])}</b> ${esc(q.solName)} ✔️<span class="fact">💡 ${q.fact}</span>`;
    if(R.boss)html+=`<span class="fact">💨 Volltreffer! Der Nebelgeist schrumpft!</span>`;
  } else {
    sfx.bad();
    if(!R.boss){ // später nochmal fragen
      if(R.queue.length<R.maxLen){const pos=Math.min(R.queue.length,R.i+3);R.queue.splice(pos,0,q.id);R.lastKindFor=R.lastKindFor||{};R.lastKindFor[q.id]=q.kind;}
    } else {R.hp=Math.min(R.maxhp,R.hp+1);}
    html=`Nicht ganz! Richtig ist: <b>${esc(q.solName)}</b><span class="fact">💡 ${q.fact}</span>`+(R.boss?'<span class="fact">🌫️ Hihihi! Der Nebelgeist wird wieder etwas größer …</span>':'<span class="fact">🔁 Keine Sorge, die Frage kommt gleich nochmal.</span>');
  }
  renderPanel({html,pick:k});
}
function shortName(q){const [t,id]=q.sol;if(t==='state')return SB[id].name;if(t==='cap')return SB[id].cap;if(t==='river')return id;if(t==='geb')return GB[id].name;return BB_[id].name+' · '+BB_[id].h+' m';}

function endRound(){
  clearHL();clearTags();
  if(R.boss){
    if(R.hp<=0){S.boss=true;save();sfx.stamp();confetti(80);bossWin();}
    else {modal(`<div style="font-size:60px">🌫️</div><h2>Fast geschafft!</h2><p>Graf Grauschleier konnte sich gerade noch verstecken. Übe noch ein bisschen in den Kapiteln – dann schaffst du ihn!</p><div class="row"><button class="btn" onclick="startBoss(true);closeModal()">Nochmal kämpfen</button><button class="btn ghost" onclick="closeModal();goHub()">Zur Expedition</button></div>`);}
    return;
  }
  const n=R.res.length,ok=R.res.filter(Boolean).length;
  const firstPct=R.queue.length?ok/n:0;
  const stars=firstPct>=.9?3:firstPct>=.7?2:firstPct>=.4?1:0;
  const st=chStats(R.ch);const c=CHB[R.ch];
  let stampNew='';
  if(st.rv===st.n&&!S.stamps[R.ch]){S.stamps[R.ch]=1;stampNew=`<p>🏅 <b>Kapitel geschafft!</b> ${c.done} Du bekommst einen Stempel in deinen Expeditions-Pass!</p>`;addPoints(50);}
  if(st.ms===st.n&&S.stamps[R.ch]!==2){S.stamps[R.ch]=2;stampNew+=`<p>🥇 <b>Goldstempel!</b> Du kannst jetzt alles in diesem Kapitel sicher!</p>`;addPoints(100);}
  save();
  if(stars>=2||stampNew){sfx.stamp();confetti(50);}
  const starH=[0,1,2].map(i=>`<span class="${i<stars?'':'off'}" style="animation-delay:${i*.2}s">⭐</span>`).join('');
  modal(`<div class="stars">${starH}</div><h2>${['Weiter üben!','Gut gemacht!','Super gemacht!','Fantastisch!'][stars]}</h2>
   <p>${ok} von ${n} Antworten richtig.${R.newRev?`<br>Du hast <b>${R.newRev}</b> neue${R.newRev===1?'s Ziel':' Ziele'} vom Nebel befreit! 🌤️`:''}</p>
   <div class="bar" style="height:14px;margin:6px 20px"><b style="width:${st.rv/st.n*100}%"></b></div>
   <p style="font-size:15px;margin-top:4px">${c.short}: ${st.rv} von ${st.n} befreit · ${st.ms} sicher gemeistert ⭐</p>${stampNew}
   <div class="row"><button class="btn" onclick="closeModal();startChapter('${R.ch}',true)">Noch eine Runde</button><button class="btn ghost" onclick="closeModal();goHub()">Zur Expedition</button></div>`);
}

/* ======================= ATLAS ======================= */
let ATLAS=false;
const atlasToggles={names:true,caps:true,rivers:true,geb:false,berg:false};
function startAtlas(){
  ATLAS=true;R=null;show('play');$('playTitle').textContent='🔭 Atlas – frei erkunden';
  Object.assign(VB,VB0);setVB();clearTags();clearHL();applyAtlasClass();
  $('panel').innerHTML=guideHTML('Hier kannst du die ganze Karte erkunden. <b>Tippe</b> auf ein Land, einen Fluss, ein Gebirge oder einen Berg!')+
   `<div class="opts" style="grid-template-columns:1fr 1fr 1fr" id="atlTog">${[['names','Länder'],['caps','Hauptstädte'],['rivers','Flüsse'],['geb','Gebirge'],['berg','Berge']].map(([k,l])=>`<button class="opt" data-k="${k}" style="font-size:14px;min-height:42px">${l}</button>`).join('')}</div><div id="atlInfo"></div>`;
  $('atlTog').querySelectorAll('.opt').forEach(b=>{b.onclick=()=>{atlasToggles[b.dataset.k]=!atlasToggles[b.dataset.k];applyAtlasClass();};});
  applyAtlasClass();
}
function applyAtlasClass(){
  const cls=Object.entries(atlasToggles).filter(([k,v])=>v).map(([k])=>'show-'+k).join(' ');
  setMode('atlas',cls);
  const t=$('atlTog');if(t)t.querySelectorAll('.opt').forEach(b=>b.classList.toggle('right',atlasToggles[b.dataset.k]));
}
function atlasInfo(type,id){
  clearTags();clearHL();let h='';
  if(type==='state'||type==='cap'){const s=SB[id];highlight('state',id);h=`<b>${s.name}</b><br>Hauptstadt: <b>${s.cap}</b><span class="fact">💡 ${s.fact}</span>`;}
  if(type==='river'){const r=RB[id];highlight('river',id);h=`Fluss: <b>${id}</b><span class="fact">💡 ${r.fact}</span>`;}
  if(type==='geb'){const g=GB[id];highlight('geb',id);h=`Gebirge: <b>${g.name}</b>${g.land?'<br>Bundesland: '+SB[g.land].name:''}<span class="fact">💡 ${g.fact}</span>`;}
  if(type==='berg'){const b=BB_[id];highlight('berg',id);h=`Berg: <b>${b.name}</b> – ${b.h} m<br>Gebirge: ${GB[b.geb].name} · ${SB[b.land].name}<span class="fact">💡 ${b.fact}</span>`;}
  const [x,y]=locOf(type==='cap'?'cap':type,id);moveBalloon(x,y);
  $('atlInfo').innerHTML='<div style="height:10px"></div>'+guideHTML(h);
}

/* ======================= MEMORY ======================= */
let MEM=null;
function startMemory(){
  const sts=shuffle(STATES).slice(0,6);
  const cards=shuffle(sts.flatMap(s=>[{k:s.id,t:'Land',v:s.name,c:s.col},{k:s.id,t:'Hauptstadt',v:s.cap,c:s.col}]));
  MEM={cards,open:[],moves:0,found:0,lock:false};
  show('memory');$('memInfo').textContent='Züge: 0';
  $('memGrid').innerHTML=cards.map((c,i)=>`<button class="mcard" data-i="${i}"><div class="in"><div class="f">🎈</div><div class="b" style="border-top:8px solid ${c.c}"><div><small>${c.t==='Land'?'🗺️ Bundesland':'🚩 Hauptstadt'}</small>${esc(c.v)}</div></div></div></button>`).join('');
  $('memGrid').querySelectorAll('.mcard').forEach(b=>b.onclick=()=>memFlip(+b.dataset.i,b));
}
function memFlip(i,b){
  if(MEM.lock||b.classList.contains('flip'))return;sfx.flip();
  b.classList.add('flip');MEM.open.push([i,b]);
  if(MEM.open.length===2){
    MEM.moves++;$('memInfo').textContent='Züge: '+MEM.moves;
    const [[i1,b1],[i2,b2]]=MEM.open;MEM.open=[];
    if(MEM.cards[i1].k===MEM.cards[i2].k&&i1!==i2){b1.classList.add('done');b2.classList.add('done');MEM.found++;sfx.ok();addPoints(5);coinFly(5,$('memInfo'));
      if(MEM.found===6){setTimeout(()=>{confetti(60);sfx.stamp();modal(`<div style="font-size:56px">🧠</div><h2>Alle Paare gefunden!</h2><p>Du hast <b>${MEM.moves}</b> Züge gebraucht.${MEM.moves<=9?' Wow, das ist ein Super-Gedächtnis!':''}</p><div class="row"><button class="btn" onclick="closeModal();startMemory()">Nochmal</button><button class="btn ghost" onclick="closeModal();goHub()">Zur Expedition</button></div>`);},600);}
    } else {MEM.lock=true;setTimeout(()=>{b1.classList.remove('flip');b2.classList.remove('flip');MEM.lock=false;},1000);}
  }
}

/* ======================= SPICKZETTEL ======================= */
function showList(){
  show('list');
  let h=`<h3>🗺️ Bundesländer und ihre Hauptstädte</h3><table><tr><th>Bundesland</th><th>Hauptstadt</th></tr>${STATES.map(s=>`<tr><td><span class="sw" style="background:${s.col}"></span>${s.name}</td><td>${s.cap}</td></tr>`).join('')}</table>
  <p style="font-size:14px;color:#6b5644">Die drei <b>Stadtstaaten</b> sind Berlin, Hamburg und Bremen.</p>
  <h3>🌊 Flüsse</h3><table><tr><th>Fluss</th><th>Gut zu wissen</th></tr>${RIVERS.map(r=>`<tr><td><b>${r.id}</b></td><td>${r.fact}</td></tr>`).join('')}</table>
  <h3>⛰️ Gebirge</h3><table><tr><th>Gebirge</th><th>Gut zu wissen</th></tr>${GEBIRGE.map(g=>`<tr><td><b>${g.name}</b></td><td>${g.fact}</td></tr>`).join('')}</table>
  <h3>🏔️ Berge</h3><table><tr><th>Berg</th><th>Höhe</th><th>Gebirge</th><th>Bundesland</th></tr>${BERGE.slice().sort((a,b)=>b.h-a.h).map(b=>`<tr><td><b>${b.name}</b></td><td>${b.h} m</td><td>${GB[b.geb].name}</td><td>${SB[b.land].name}</td></tr>`).join('')}</table>`;
  $('listBody').innerHTML=h;
}

/* ======================= MODALS & STORY ======================= */
function modal(html){$('ovBox').innerHTML=html;$('ov').classList.add('on');}
function closeModal(){$('ov').classList.remove('on');}
function storyModal(c,go){
  modal(`<div style="width:74px;height:74px;border-radius:22px;background:${c.bg};display:grid;place-items:center;font-size:44px;margin:0 auto">${c.icon}</div>
  <h2>${c.title}</h2>${guideHTML(c.story).replace('class="guide"','class="guide" style="text-align:left;margin:10px 0"')}
  <div class="row"><button class="btn" id="goCh">Los geht's! 🎈</button><button class="btn ghost" onclick="closeModal()">Später</button></div>`);
  $('goCh').onclick=()=>{closeModal();sfx.whoosh();go();};
}
function ghostSVG(sz){return `<svg viewBox="0 0 60 48" ${sz?`style="width:${sz}px;height:${sz*.8}px"`:''}><path d="M10 40 C2 40 2 28 10 27 C8 16 22 10 28 18 C32 6 52 8 50 22 C58 22 60 36 50 40 Z" fill="#dfe3ec" stroke="#7d8496" stroke-width="2"/><ellipse cx="25" cy="29" rx="3.2" ry="4" fill="#2f3149"/><ellipse cx="38" cy="29" rx="3.2" ry="4" fill="#2f3149"/><path d="M21 22 l7 3 M42 22 l-7 3" stroke="#2f3149" stroke-width="2.2" stroke-linecap="round"/><path d="M26 37 q5.5 -4 11 0" fill="none" stroke="#2f3149" stroke-width="2" stroke-linecap="round"/></svg>`;}
function bossIntro(){
  modal(`<div style="margin:0 auto;width:120px">${ghostSVG(120)}</div><h2>Das große Finale</h2>
  ${guideHTML(`Oh nein, da ist er: <b>Graf Grauschleier</b>! Er will die Zauberkarte zurück in den Nebel hüllen. Jede richtige Antwort ist ein Windstoß, der ihn schrumpfen lässt. Bei einem Fehler wächst er wieder ein bisschen. Es kommen Fragen aus <b>allen</b> Kapiteln – wie bei einem echten Test!`).replace('class="guide"','class="guide" style="text-align:left;margin:10px 0"')}
  <div class="row"><button class="btn" id="goBoss">Ich bin bereit! ⚡</button><button class="btn ghost" onclick="closeModal()">Später</button></div>`);
  $('goBoss').onclick=()=>{closeModal();sfx.whoosh();startBoss(true);};
}
function bossWin(){
  const d=new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
  modal(`<div class="cert printme"><div style="font-size:44px">🎈🗺️🦉</div><h1>URKUNDE</h1><p>Hiermit wird bestätigt, dass</p><div class="nm">${esc(S.name||'unser Entdecker')}</div>
  <p>Graf Grauschleier besiegt und die <b>Zauberkarte von Deutschland</b> gerettet hat!<br>Ab heute trägt ${esc(S.name||'er')} den Titel</p>
  <h2 style="color:#9a6b00;margin:4px 0">Meister-Entdecker Deutschlands</h2>
  <div class="seal">EULE EMMA<br>✔<br>GEPRÜFT</div><p style="font-size:14px;margin-top:12px">${d} · ${S.points} Entdecker-Punkte</p></div>
  <div class="row noprint"><p style="font-size:15px;width:100%;margin:0">📸 Tipp: Mach einen Screenshot von deiner Urkunde!</p><button class="btn ghost" onclick="closeModal();goHub()">Zur Expedition</button></div>`);
}

/* ======================= INTRO ======================= */
let introStep=0;
const INTRO=[
 ()=>`<div class="scene">${introScene(true)}</div><h1>Die Deutschland-Expedition</h1><p>Hallo! Ich bin <b>Eule Emma</b> 🦉, die Hüterin der <b>Zauberkarte von Deutschland</b>.</p><p>Auf ihr sind alle Länder, Städte, Flüsse und Berge verzeichnet.</p>`,
 ()=>`<div class="scene">${introScene(false)}</div><h1>Oh nein!</h1><p>Heute Nacht kam <b>Graf Grauschleier</b>, der Nebelgeist. Er hat die ganze Karte in dichten Nebel gehüllt!</p><p>Nur ein mutiger Entdecker kann ihn vertreiben: Mit jeder richtigen Antwort pustet dein <b>Ballon</b> ein Stück Nebel weg.</p>`,
 ()=>`<div style="font-size:64px;margin:6px 0">🎈</div><h1>Wie heißt du?</h1><p>Schreib deinen Namen – und wähle die Farbe deines Ballons.</p><input class="nameinput" id="nameIn" maxlength="20" placeholder="Dein Name" value="${esc(S.name)}"><div class="colors" id="colIn">${BCOLORS.map(c=>`<button style="background:${c}" data-c="${c}" class="${c===S.color?'on':''}"></button>`).join('')}</div>`,
 ()=>`<div class="scene">${introScene(true,true)}</div><h1>Auf geht's${S.name?', '+esc(S.name):''}!</h1><p>Dein Ballon startet in <b>Paderborn</b> 🏠. Wusstest du? Die <b>Pader</b> ist nur etwa 4 km lang – einer der kürzesten Flüsse Deutschlands.</p><p>Befreie in 5 Kapiteln die ganze Karte – und besiege am Ende Graf Grauschleier!</p>`
];
function introScene(happy,balloon){
  const fog=!happy;
  return `<svg viewBox="0 0 400 190" width="100%" height="100%">
   <rect x="60" y="30" width="280" height="150" rx="10" fill="#f2deb0" stroke="#b9925a" stroke-width="3" transform="rotate(-3 200 105)"/>
   <path d="M150 50 C175 40 205 48 222 60 C245 70 250 95 240 112 C252 130 235 160 205 165 C180 170 160 160 150 140 C130 125 128 95 140 80 C132 68 138 56 150 50Z" fill="${fog?'#c7ccd5':'#9bd27a'}" stroke="#fff" stroke-width="2"/>
   ${fog?'':'<path d="M150 50 C175 40 205 48 222 60 L200 100 L150 80Z" fill="#ffd166" opacity=".9"/><path d="M200 100 L240 112 C252 130 235 160 205 165Z" fill="#7cc3e8" opacity=".9"/><path d="M165 60 C180 90 175 120 195 160" stroke="#2a7fc0" stroke-width="3" fill="none"/>'}
   ${fog?`<g transform="translate(250 20) scale(1.6)">${ghostSVG().replace(/<\/?svg[^>]*>/g,'')}</g><circle cx="120" cy="100" r="26" fill="#dde1e8" opacity=".9"/><circle cx="290" cy="140" r="30" fill="#dde1e8" opacity=".9"/><circle cx="200" cy="40" r="22" fill="#dde1e8" opacity=".85"/>`:''}
   ${balloon||!fog?`<g transform="translate(${balloon?95:320} ${balloon?95:80}) scale(2)">${balloonSVG(S.color,1)}</g>`:''}
   <text x="${fog?70:60}" y="185" font-size="40">🦉</text>
  </svg>`;
}
function renderIntro(){
  $('introBody').innerHTML=INTRO[introStep]();
  $('introDots').innerHTML=INTRO.map((_,i)=>`<i class="${i===introStep?'on':''}"></i>`).join('');
  $('introBack').style.visibility=introStep?'visible':'hidden';
  $('introNext').textContent=introStep===INTRO.length-1?'Expedition starten 🎈':'Weiter ➜';
  const ci=$('colIn');if(ci)ci.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.color=b.dataset.c;ci.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));save();setBalloonColor();});
  const ni=$('nameIn');if(ni){ni.oninput=()=>{S.name=ni.value.trim();save();};}
}
$('introNext').onclick=()=>{sfx.flip();if(introStep<INTRO.length-1){introStep++;renderIntro();}else{S.started=true;save();goHub();}};
$('introBack').onclick=()=>{if(introStep>0){introStep--;renderIntro();}};

/* ======================= HUB ======================= */
function goHub(){
  ATLAS=false;R=null;show('hub');updCoins();
  $('hubName').textContent=S.name?`${S.name}s Expedition`:'Deutschland-Expedition';
  $('hubRank').textContent='Rang: '+rank();
  $('hubChapters').innerHTML=CHAPTERS.map((c,i)=>{const st=chStats(c.id);const sp=S.stamps[c.id];
    return `<button class="ccard" data-ch="${c.id}"><div class="ic" style="background:${c.bg}">${c.icon}</div><div style="flex:1"><div class="s">Kapitel ${i+1} · ${c.short}</div><div class="t">${c.title}</div>
    <div class="bar"><b style="width:${st.rv/st.n*100}%"></b></div><div class="s">${st.rv}/${st.n} befreit · ${st.ms} ⭐ sicher</div></div>${sp?`<div class="stamp ${sp===2?'gold':''}">${sp===2?'GOLD<br>★':'GE-<br>SCHAFFT'}</div>`:''}</button>`;}).join('')+
   `<button class="ccard boss" id="cBoss"><div class="ic" style="background:#454866">${ghostSVG(48)}</div><div style="flex:1"><div class="s">Finale</div><div class="t">Graf Grauschleier besiegen</div><div class="s">${S.boss?'Besiegt! 🏆 Hol dir die Urkunde nochmal.':'Fragen aus allen Kapiteln – wie im echten Test'}</div></div>${S.boss?'<div class="stamp gold">SIEG<br>🏆</div>':''}</button>`;
  $('hubChapters').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>startChapter(b.dataset.ch));
  $('cBoss').onclick=()=>startBoss();
  $('hubExtras').innerHTML=[
    ['atlas','🔭','Atlas','Die ganze Karte frei erkunden','#d3ecfb'],
    ['mem','🃏','Hauptstadt-Memory','Finde Land und Hauptstadt','#ffe3c2'],
    ['list','📜','Spickzettel','Alles auf einen Blick zum Nachlesen','#efe2c4'],
    ['cert','🏆','Urkunde',S.boss?'Deine Urkunde ansehen':'Gibt es nach dem Finale','#fff0b8']
  ].map(([k,ic,t,s,bg])=>`<button class="ccard" data-x="${k}"><div class="ic" style="background:${bg}">${ic}</div><div><div class="t">${t}</div><div class="s">${s}</div></div></button>`).join('');
  $('hubExtras').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const k=b.dataset.x;if(k==='atlas')startAtlas();if(k==='mem')startMemory();if(k==='list')showList();if(k==='cert'){if(S.boss)bossWin();else modal(`<div style="font-size:56px">🔒</div><h2>Noch verschlossen</h2><p>Die Urkunde bekommst du, wenn du im Finale Graf Grauschleier besiegt hast!</p><div class="row"><button class="btn" onclick="closeModal()">OK</button></div>`);}});
}
$('btnHome').onclick=goHub;$('memHome').onclick=goHub;$('listHome').onclick=goHub;
$('btnStory').onclick=()=>{introStep=0;show('intro');renderIntro();};
let resetArm=false;
$('btnReset').onclick=()=>{if(!resetArm){resetArm=true;$('btnReset').textContent='Wirklich alles löschen? Nochmal tippen!';setTimeout(()=>{resetArm=false;$('btnReset').textContent='Fortschritt zurücksetzen';},4000);return;}
  S.points=0;S.items={};S.stamps={};S.boss=false;save();resetArm=false;$('btnReset').textContent='Fortschritt zurücksetzen';applyRevealed();goHub();};
function updSound(){$('btnSound').textContent=S.muted?'🔇':'🔊';}
$('btnSound').onclick=()=>{S.muted=!S.muted;save();updSound();};
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeModal();});

/* ======================= START ======================= */
updSound();updCoins();
requestAnimationFrame(()=>{riverLabels();});
if(S.started){goHub();}else{show('intro');renderIntro();}
</script>
